<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Billetterie en ligne">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#3b82f6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)" opacity="0.14"/>
  <g transform="translate(400,225) rotate(-8)" stroke="url(#accent)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-150,-70 L-150,-22 a22,22 0 0 1 0,44 L-150,70 L150,70 L150,22 a22,22 0 0 0 0,-44 L150,-70 Z"/>
    <!-- couleur pleine : un trait vertical a une bbox de largeur nulle, un dégradé
         en objectBoundingBox y dégénère et le trait ne se peint pas. -->
    <line x1="45" y1="-52" x2="45" y2="52" stroke="#2f6fe4" stroke-dasharray="12 12" stroke-width="6"/>
    <path d="M-108,-22 L-18,-22 M-108,18 L-58,18" stroke-width="6" opacity="0.55"/>
    <circle cx="100" cy="0" r="8" fill="#3b82f6" stroke="none"/>
  </g>
</svg>
