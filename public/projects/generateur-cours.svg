<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Générateur de cours par IA">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#3b82f6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)" opacity="0.14"/>
  <g transform="translate(400,250)" stroke="url(#accent)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-120,-70 C-80,-95 -30,-95 0,-75 C30,-95 80,-95 120,-70 L120,70 C80,45 30,45 0,65 C-30,45 -80,45 -120,70 Z"/>
    <!-- couleur pleine : un trait vertical a une bbox de largeur nulle, un dégradé
         en objectBoundingBox y dégénère et le trait ne se peint pas. -->
    <path d="M0,-75 L0,65" stroke="#2f6fe4"/>
    <path d="M-85,-35 L-35,-35 M-85,0 L-35,0 M35,-35 L85,-35 M35,0 L85,0" stroke-width="7" opacity="0.7"/>
    <circle cx="95" cy="-105" r="26" stroke-width="8"/>
    <path d="M84,-105 L92,-97 L108,-114" stroke-width="8"/>
  </g>
</svg>
